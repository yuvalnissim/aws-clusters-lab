apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-demo
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: internal-demo
  template:
    metadata:
      labels:
        app: internal-demo
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: internal-demo
      containers:
        - name: web
          image: ghcr.io/nginx/nginx-unprivileged:1.28-alpine
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: internal-demo
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: internal-demo
  ports:
    - port: 80
      targetPort: 8080